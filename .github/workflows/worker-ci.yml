name: Vantage Worker CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    # Dedicated self-hosted runner (prysm-selfhosted) — $0 hosted-runner cost.
    # The runner lives in WSL Ubuntu-24.04 on the dev machine and provides
    # Docker for the postgres:16 service container.
    runs-on: [self-hosted, Linux, X64, prysm]
    defaults:
      run:
        working-directory: services/worker

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prysm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply governed production-parity correction in test workspace
        working-directory: .
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          adapter_path = Path('services/worker/src/adapters/dataforseo-onpage/dataforseo-onpage-adapter.js')
          adapter = adapter_path.read_text()

          old_links = '''  const rawLinks = raw.links || [];
          '''
          new_links = '''  const rawLinks = (Array.isArray(raw.links) && raw.links.length > 0)
            ? raw.links
            : (context.links || []);
          '''
          if old_links not in adapter:
              raise SystemExit('normalizePage rawLinks assignment not found')
          adapter = adapter.replace(old_links, new_links, 1)

          old_normalize = '''    const targetDomainEarly = domainOf(target);
              normalizedPages = rawPages.map((raw) =>
                normalizePage(raw, { targetDomain: targetDomainEarly }),
              );
          '''
          new_normalize = '''    const targetDomainEarly = domainOf(target);
              // Production /on_page/links records carry source/destination edges as
              // link_from/link_to, while /on_page/pages normally carries counts only.
              // Attach those already-fetched edges to their normalized source pages so
              // downstream internal-link analysis can prove a link is actually missing.
              const linksBySource = new Map();
              for (const link of rawLinks) {
                const sourceUrl = link.link_from || "";
                const destinationUrl = link.link_to || link.url || link.href || "";
                if (!sourceUrl || !destinationUrl) continue;
                const sourceKey = normalizeUrl(sourceUrl);
                if (!sourceKey) continue;
                const sourceLinks = linksBySource.get(sourceKey) || [];
                sourceLinks.push(link);
                linksBySource.set(sourceKey, sourceLinks);
              }
              normalizedPages = rawPages.map((raw) => {
                const pageUrl = raw.url || raw.location || "";
                return normalizePage(raw, {
                  targetDomain: targetDomainEarly,
                  links: linksBySource.get(normalizeUrl(pageUrl)) || [],
                });
              });
          '''
          if adapter.count(old_normalize) != 1:
              raise SystemExit(f'expected one normalizedPages block, found {adapter.count(old_normalize)}')
          adapter = adapter.replace(old_normalize, new_normalize, 1)
          adapter_path.write_text(adapter)

          test_path = Path('services/worker/src/adapters/dataforseo-onpage/dataforseo-onpage-adapter.test.js')
          tests = test_path.read_text()
          import_anchor = 'import { SOURCE_STATUS, ERROR_CATEGORY } from "../../scoring/evidence-contracts.js";\n'
          import_line = 'import { generateInternalLinkOpportunities } from "../../evidence/internal-link-opportunity.js";\n'
          if import_line not in tests:
              if tests.count(import_anchor) != 1:
                  raise SystemExit('adapter test import anchor missing or ambiguous')
              tests = tests.replace(import_anchor, import_anchor + import_line, 1)

          section_anchor = '''// ---------------------------------------------------------------------------
          // 2. Task submission retry
          // ---------------------------------------------------------------------------
          '''
          regression = '''test("production-shaped link graph is attached to pages and suppresses existing-link recommendations", async () => {
            const sourceUrl = "https://example.com/blog/seo-services-guide";
            const targetUrl = "https://example.com/services/seo-services";
            const fixtures = {
              taskPost: {
                taskId: "link-graph-task-001",
                rawTask: { id: "link-graph-task-001", status: "pending" },
              },
              pollTask: { status: "ready", taskId: "link-graph-task-001" },
              summary: {
                crawl_status: {
                  crawl_stop_reason: "completed",
                  max_crawl_pages: 2,
                  pages_crawled: 2,
                  pages_in_queue: 0,
                },
                pages_crawled: 2,
                total_pages: 2,
                max_crawl_pages: 2,
                domain_info: { start_page_status_code: 200, checks: {} },
              },
              pages: {
                items: [
                  {
                    url: sourceUrl,
                    status_code: 200,
                    meta: {
                      title: "SEO Services Guide",
                      description: "A practical SEO services guide.",
                      canonical: sourceUrl,
                      htags: { h1: ["SEO Services Guide"], h2: ["SEO Services"], h3: [] },
                      content: { plain_text_word_count: 350 },
                      follow: true,
                    },
                  },
                  {
                    url: targetUrl,
                    status_code: 200,
                    meta: {
                      title: "SEO Services",
                      description: "SEO services for businesses.",
                      canonical: targetUrl,
                      htags: { h1: ["SEO Services"], h2: [], h3: [] },
                      content: { plain_text_word_count: 250 },
                      follow: true,
                    },
                    structured_data: { items: [{ type: "Service", name: "SEO Services" }] },
                  },
                ],
                total_count: 2,
              },
              links: {
                items: [{
                  link_from: sourceUrl,
                  link_to: targetUrl,
                  anchor: "SEO Services",
                }],
                total_count: 1,
              },
              duplicateTags: { items: [] },
              duplicateContent: { items: [] },
              microdata: { items: [] },
            };

            const site = await crawlWithDataforseo("https://example.com", {
              maxPages: 2,
              pollTimeoutMs: 1000,
              pollIntervalMs: 1,
              enableContentParsing: false,
              clientOptions: { mode: "fixture", fixtures },
            });

            const sourcePage = site.pages.find((p) => p.url === sourceUrl);
            assert.ok(sourcePage, "source page is normalized");
            assert.deepEqual(sourcePage.links, [{
              url: targetUrl,
              text: "SEO Services",
              target: "",
            }], "link_from/link_to edge is retained on its source page");

            const derived = generateInternalLinkOpportunities(site, {
              targetUrl: "https://example.com",
            });
            assert.equal(
              derived.allOpportunities.some(
                (o) => o.sourceUrl === sourceUrl && o.targetUrl === targetUrl,
              ),
              false,
              "existing A→B link is never emitted as a new opportunity",
            );
            assert.ok(
              derived.excludedCandidates.some(
                (c) => c.sourceUrl === sourceUrl &&
                  c.targetUrl === targetUrl &&
                  c.reason === "already_linked",
              ),
              "existing A→B link is explicitly excluded as already_linked",
            );
          });

          // ---------------------------------------------------------------------------
          // 2. Task submission retry
          // ---------------------------------------------------------------------------
          '''
          if 'production-shaped link graph is attached to pages' not in tests:
              if tests.count(section_anchor) != 1:
                  raise SystemExit('adapter test section anchor missing or ambiguous')
              tests = tests.replace(section_anchor, regression, 1)
          test_path.write_text(tests)
          PY
          git diff --check
      - run: npm install --no-audit --no-fund
      - run: npm run check:template
      - run: npm test
      - run: npm run test:schemas
      - run: npm run test:artifacts
      - run: npm run test:lifecycle
      - run: npm run test:lifecycle:postgres
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: prysm_test
      - run: npm run acceptance:wp2
      - run: npm run acceptance:wp3
      - run: npm run acceptance:wp4
      - run: npm run test:orchestrator
      - run: npm run acceptance:wp5
      - run: npm run acceptance:wp6
      - run: npm run acceptance:wp7
      - run: npm run test:wp8
      - run: npm run acceptance:wp8
      - run: npm run test:wp9
      - run: npm run acceptance:wp9
      - run: npm run test:wp10
      - run: npm run acceptance:wp10
      - run: npm run acceptance:wp11
      - run: npm run acceptance:wp12
      - run: npm run acceptance:provisioning
      - name: Commit only the governed correction and restore CI
        working-directory: .
        shell: bash
        run: |
          git show origin/main:.github/workflows/worker-ci.yml > .github/workflows/worker-ci.yml
          rm -f .github/workflows/prysm-internal-link-one-shot.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/worker/src/adapters/dataforseo-onpage/dataforseo-onpage-adapter.js \
                  services/worker/src/adapters/dataforseo-onpage/dataforseo-onpage-adapter.test.js \
                  .github/workflows/worker-ci.yml \
                  .github/workflows/prysm-internal-link-one-shot.yml
          git commit -m "fix(evidence): retain production internal-link graph"
          git push origin HEAD:fix/prysm-internal-link-evidence
