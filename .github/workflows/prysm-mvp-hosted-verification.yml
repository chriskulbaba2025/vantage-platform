name: PRYSM MVP Hosted Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'repair/prysm-mvp-client-readiness-2026-09-21'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prysm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --test src/encyclopedia/*.test.js src/solution/solution-authority-provider.test.js src/report/render-report-v2.test.js
      - run: npm test
      - run: npm run test:narrative-v2
      - run: npm run verify:prysm-whole-app
      - run: npm run verify:prysm-closure
      - run: npm run test:lifecycle:postgres
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: prysm_test
      - run: npm run acceptance:wp2
      - run: npm run acceptance:wp3
      - run: npm run acceptance:wp4
      - run: npm run test:orchestrator
      - run: npm run acceptance:wp5
      - run: npm run acceptance:wp6
      - run: npm run acceptance:wp7
      - run: npm run test:wp8
      - run: npm run acceptance:wp8
      - run: npm run test:wp9
      - run: npm run acceptance:wp9
      - run: npm run test:wp10
      - run: npm run acceptance:wp10
      - run: npm run acceptance:wp11
      - run: npm run acceptance:wp12
      - run: npm run acceptance:provisioning
