name: PRYSM ACTIVATE 01

on:
  push:
    branches:
      - "fix/prysm-production-activation"

permissions:
  contents: write

jobs:
  patch_verify_commit:
    runs-on: [self-hosted, Linux, X64, prysm]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirm governed Linux runtime
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          command -v node
          node --version
          node -e 'if (process.platform !== "linux") process.exit(1)'

      - name: Disambiguate the one duplicated controlled-test anchor
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('.governance/changes/prysm-activate-01-patch.py')
          text = p.read_text()
          old = '''    if count != 1:\n        raise SystemExit(f"FAIL-CLOSED: {path}: expected exactly 1 anchor, found {count}")\n    p.write_text(text.replace(old, new, 1))\n    print(f"patched {path}")'''
          new = '''    if count != 1:\n        if path == "tests/wp11/full-flow.spec.ts" and count == 2 and old.startswith('        services: ["Consulting"]'):\n            p.write_text(text.replace(old, new, 1))\n            print(f"patched first controlled draft fixture in {path} (2 expected matches)")\n            return\n        raise SystemExit(f"FAIL-CLOSED: {path}: expected exactly 1 anchor, found {count}")\n    p.write_text(text.replace(old, new, 1))\n    print(f"patched {path}")'''
          if text.count(old) != 1:
              raise SystemExit('FAIL-CLOSED: patch-helper guard anchor drifted')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Apply fail-closed exact patch
        run: python3 .governance/changes/prysm-activate-01-patch.py

      - name: Verify worker regressions
        run: |
          set -euo pipefail
          cd services/worker
          npm install --no-audit --no-fund
          npm run check:template
          npm test
          npm run acceptance:provisioning
          npm run acceptance:wp12
          node scripts/acceptance-tenant.js
          node scripts/acceptance-wpi.js

      - name: Verify web build and controlled browser flows
        env:
          VANTAGE_WEBHOOK_SECRET: test-secret
          PRYSM_IDENTITY_MODE: mock
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npx next build
          npx playwright test tests/wp11/full-flow.spec.ts tests/provisioning/admin-flow.spec.ts

      - name: Commit verified patch
        run: |
          set -euo pipefail
          rm .github/workflows/prysm-activate-01-autofix.yml
          rm .governance/changes/prysm-activate-01-patch.py
          git config user.name "prysm-governed-bot"
          git config user.email "prysm-governed-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(prysm): close production product boundary [ACTIVATE-AUTOFIX]"
          git push origin HEAD:fix/prysm-production-activation
